
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treyon | Men's Fashion</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    header {
      background: #111;
      color: white;
      padding: 25px;
      text-align: center;
    }
    nav {
      background: #222;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 12px;
    }
    .hero {
      text-align: center;
      padding: 90px 20px;
      background: white;
    }
    .hero h1 {
      font-size: 42px;
    }
    .hero button {
      background: black;
      color: white;
      padding: 14px 28px;
      border: none;
      cursor: pointer;
    }
    footer {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>TREYON</h1>
  <p>Style That Defines You</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#products">Products</a>
  <a href="#contact">Contact</a>
</nav>

<section class="hero">
  <h1>Welcome to Treyon</h1>
  <p>Discover Your Everyday Fashion.</p>
  <button onclick="document.getElementById('products').scrollIntoView()">Explore Collection</button>
</section>

<section id="products" class="hero">
  <h2>Our Collection</h2>
  <p>Shirts | T-Shirts | Genji | Sweaters | Pants</p>
</section>

<footer id="contact">
  <h3>TREYON</h3>
  <p>Men's Fashion Brand</p>
  <p>Contact us for orders</p>
</footer>

</body>
</html>
